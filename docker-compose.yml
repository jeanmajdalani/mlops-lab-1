
services:
  mlflow:
    build: ./mlflow
    image: food11-mlflow:lab4
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/mlflow-data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  inference:
    build:
      context: .
      dockerfile: dockerfile
    image: food11-api:lab4
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODEL_URI: models:/food11@champion
    volumes:
    - mlflow-data:/mlflow-data
    depends_on:
      mlflow:
        condition: service_healthy

  frontend:
    build: ./frontend
    image: food11-frontend:lab4
    ports:
      - "8501:8501"
    environment:
      INFERENCE_URL: http://inference:8000
    depends_on:
      - inference

volumes:
  mlflow-data:
