
[project]
name = "food11-api"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.114.1",
    "uvicorn>=0.54.0",
    "python-multipart>=0.0.32",
    "pillow>=12.3.0",
    "mlflow>=3.16.1",
    "numpy",
    "torch==2.9.0",
    "torchvision==0.24.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
